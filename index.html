<style>
body{font-family:"Segoe UI","Microsoft JhengHei", sans-serif;background:#f3f7f5;/* ✅ 整體背景顏色 */padding:4px 20px}
input, textarea, button{font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;}
textarea{font-size: 15px;line-height: 1.6;}

h1{

.board{

.column{background:#fff;border-radius:12px;padding:10px;flex:1;min-width:0;max-height: 100%;overflow-y: auto;}

.card{

const BL_COLOR_POOL = [
  '#7A9E8E',
  '#BCBD8B',
  '#373D20',

  '#769FB6',

function passFilter(p){

  let requester = p.info?.['requester'] || '-';
  let bl = p.info?.['BL'] || '-';
  let typeName = p.info?.['type name'] || '-';
  let packageType = p.info?.['package type'] || '-';

  if(filters.project?.length && !filters.project.includes(p.name)) return false;
  if(filters.requester.length && !filters.requester.includes(requester)) return false;
  if(filters.bl.length && !filters.bl.includes(bl)) return false;

  if(filters.packageType?.length){
    let pkgList = (packageType || '')
      .split(',')
      .map(s => s.trim())
      .filter(s => s);

    if(!pkgList.some(p => filters.packageType.includes(p))){
      return false;
    }
  }

  let typeList = splitTypeNames(typeName);
  if(filters.type.length && !typeList.some(t => filters.type.includes(t))) return false;
  if(filters.status.length && !filters.status.includes(p.status)) return false;

  return true;
}
function getSystemValue(project, targetLabel){

if(!project?.noteData?.system){
    return '';
}

let row = project.noteData.system.find(item =>
    item.text &&
    item.text.startsWith(targetLabel + ':')
);

if(!row){
    return '';
}

return row.text
    .substring((targetLabel + ':').length)
    .trim();
}

function getBLColor(bl){

  if(!bl || bl === '-') return '#7a9e8e';

  // ✅ 已存在 → 直接用
  if(BL_COLOR_MAP[bl]){
    return BL_COLOR_MAP[bl];
  }

  // ✅ 新 BL → 分配顏色
  let usedColors = Object.values(BL_COLOR_MAP);

  let color = BL_COLOR_POOL.find(c => !usedColors.includes(c));

  // ✅ 如果顏色用完 → 隨機 fallback
  if(!color){
    color = BL_COLOR_POOL[Math.floor(Math.random() * BL_COLOR_POOL.length)];
  }

  BL_COLOR_MAP[bl] = color;

  // ✅ 存起來（關鍵🔥）
  localStorage.setItem('BL_COLOR_MAP', JSON.stringify(BL_COLOR_MAP));

  return color;
}

function openAddProjectModal(){

  let name = prompt("Enter project name");

  if(!name) return;

  addProjectWithName(name);

}

function splitTypeNames(str){
  if(!str) return ['-'];

  return str
    .split(',')
    .map(s => s.trim())
    .filter(s => s);
}

function parseLocalDate(dateStr){
  if(!dateStr) return null;

  let [y, m, d] = dateStr.split('-').map(Number);

  return new Date(y, m - 1, d); // ✅ 用本地時間
}

function getCurrentWeekNumber() {
  let today = new Date();

  // ISO week（標準週數算法）
  let temp = new Date(today.getTime());

  // 調整到該週的星期四（ISO規則）
  temp.setDate(temp.getDate() + 4 - (temp.getDay() || 7));

  let yearStart = new Date(temp.getFullYear(), 0, 1);

  let weekNo = Math.ceil((((temp - yearStart) / 86400000) + 1) / 7);

  return weekNo;
}

function removeNode(target, list){
  let index = list.indexOf(target);

  if(index !== -1){
    list.splice(index, 1);
    return true;
  }

  for(let item of list){
    if(item.children && item.children.length){
      let found = removeNode(target, item.children);
      if(found) return true;
    }
  }

  return false;
}

function updateThisPopup(){

  let rect = d.getBoundingClientRect();
  let modalRect = document.querySelector('.box').getBoundingClientRect();

if(
  rect.top < modalRect.top ||           // 上超出
  rect.bottom > modalRect.bottom ||     // 下超出
  rect.left < modalRect.left ||         // 左超出
  rect.right > modalRect.right          // 右超出
){
  popup.style.display = 'none';
}else{
  popup.style.display = 'block';
}

  let left = rect.right + 8;
  let top  = rect.top - 10;

  // ✅ 右邊界限制
  if(left + popup.offsetWidth > modalRect.right){
    left = modalRect.right - popup.offsetWidth - 10;
  }

  // ✅ 左邊界限制
  if(left < modalRect.left){
    left = modalRect.left + 10;
  }

  // ✅ 上邊界
  if(top < modalRect.top){
    top = modalRect.top + 10;
  }

  // ✅ 下邊界
  if(top + popup.offsetHeight > modalRect.bottom){
    top = modalRect.bottom - popup.offsetHeight - 10;
  }

  popup.style.left = left + 'px';
  popup.style.top  = top + 'px';

  requestAnimationFrame(updateThisPopup);
}

updateThisPopup();

};

      let ex = p.ft.find(x=>x.type===typeInput.value&&x.week===w&&x.year===y);

      if(ex){
        ex.hours = h;

          tester:testerInput.value,
          handler:handlerInput.value,

        });

    }

    save();
    renderProject();
  };

  // ========= weeks =========
  let weekSet = new Set();
p.ft.forEach(r=>{

  if(
    r.year === currentYear &&
    Number(r.hours) > 0
  ){

  }

});

      cell.style.textAlign = 'center';

      cell.style.justifyContent = 'center';

      if(val){

        cell.textContent = val;

        cell.style.background = '#7a9e8e';

        cell.style.margin = '0 1px';

        input.style.width = '50px';

        cell.innerHTML = '';
        cell.appendChild(input);

        input.focus();

        function saveEdit(){

          let newVal = Number(input.value);

          let rows = p.ft.filter(x =>
            x.type === type &&
            x.week === w &&
            x.year === currentYear
          );

         if(rows.length === 0){

  if(newVal > 0){

    p.ft.push({
      type,
      tester:data.tester,
      handler:data.handler,
      year:currentYear,
      week:w,
      hours:newVal
    });

  }

}else{

  if(newVal <= 0){

    p.ft = p.ft.filter(x =>
      !(
        x.type === type &&
        x.week === w &&
        x.year === currentYear
      )
    );

  }else{

    rows.forEach(r=>{
      r.hours = newVal;
    });

  }

}

          save();
          renderProject();
        }

        input.onblur = saveEdit;

        input.onkeydown = e=>{
          if(e.key === 'Enter'){

      let weekList = Object.keys(data.weeks)
        .map(Number)
        .sort((a,b)=>a-b);

      let nextWeek =
        weekList.length
        ? Math.max(...weekList) + 1
        : 1;

      if(nextWeek > 52){
        return;
      }

      let newHour = prompt(
        `Hours for W${nextWeek}`,
        ''
      );

      if(newHour === null) return;

      p.ft.push({
        type:type,
        tester:data.tester,
        handler:data.handler,
        year:currentYear,
        week:nextWeek,
        hours:Number(newHour) || 0

      save();

function getMonday(d){d=new Date(d);let day=d.getDay()||7;if(day!==1)d.setDate(d.getDate()-day+1);return d}
function prevMonth(){
  currentMonth.setMonth(currentMonth.getMonth() - 1);
  renderGlobal();
}

function nextMonth(){
  currentMonth.setMonth(currentMonth.getMonth() + 1);
  renderGlobal();
}

function prevGanttYear(){
  ganttYear--;
  renderProject();
}

function nextGanttYear(){
  ganttYear++;
  renderProject();
}

function shiftFlow(layer, shift){

  let all = getAllItems(layer);

  all.forEach(it => {

    // ✅ 只有 week mode 才處理
    if(it.startWeek && it.endWeek){

      it.startWeek += shift;
      it.endWeek += shift;

      // ✅ 防呆
      if(it.startWeek < 1) it.startWeek = 1;
      if(it.endWeek > 52) it.endWeek = 52;
    }

  });

}

function renderGantt(){
let g=document.getElementById('gantt');

g.style.overflowX = 'auto';
g.style.whiteSpace = 'nowrap';

g.innerHTML = `
  <div style="display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:10px;">
    <button onclick="prevGanttYear()">◀</button>
    <div style="font-weight:600">${ganttYear}</div>
    <button onclick="nextGanttYear()">▶</button>

function findParentWithList(target, list){
  for(let item of list){

    if(item.children && item.children.includes(target)){
      return {
        parent: item,
        list: item.children
      };
    }

    if(item.children){
      let found = findParentWithList(target, item.children);
      if(found) return found;
    }
  }

  return null;
}

function undoLastItem(){

if(item.children && item.children.length){

list.splice(index, 0, item);

function getAllItems(list){
  let result = [];

  list.forEach(it => {
    result.push(it);

    if(it.children && it.children.length){
      result = result.concat(getAllItems(it.children));
    }
  });

  return result;
}

function getPaths(list){

  let result = [];

  function dfs(node, path){

    // ✅ 加自己
    path.push(node);

    // ✅ 到底（沒有 children）
    if(!node.children || node.children.length === 0){

      // ✅ 存一條完整路徑
      result.push([...path]);

    }else{

      // ✅ 往下
      node.children.forEach(child=>{
        dfs(child, path);
      });

    }

    // ✅ 回上一層
    path.pop();
  }

  // ✅ 每個 root 開始
  list.forEach(root=>{
    dfs(root, []);
  });

  return result;
}

function packBars(bars){

  bars.sort((a,b) => a.start - b.start);

  let lanes = [];

  bars.forEach(b => {

    let placed = false;

    for(let i=0;i<lanes.length;i++){
      if(lanes[i] < b.start){
        lanes[i] = b.end;
        b.lane = i;
        placed = true;
        break;
      }
    }

    if(!placed){
      lanes.push(b.end);
      b.lane = lanes.length - 1;
    }

  });

  return {
    bars: bars,
    laneCount: lanes.length
  };
}

let paths = getPaths(l);

paths.forEach(path=>{

    }

 
if(it.startWeek && it.endWeek){

    if(it.year === currentYear){
      rowBars.push({
        name: it.name,
        start: it.startWeek,

      });
    }

  }else{

        name: it.name,
        start: it.startWeek,

      });

    if(it.year + 1 === currentYear){
      rowBars.push({
        name: it.name,
        start: 1,
        end: it.endWeek
      });
    }

  }

    }

  });

  rows[flowName].rows.push(rowBars);

});


});

r.rows.forEach((rowBars, rowIndex) => {

    label.style.left = (left + width / 2) + 'px';

function createFilterMenu(values, selected, onChange){

  let box = document.createElement('div');

  box.style.position = 'absolute';
  box.style.background = '#fff';
  box.style.border = '1px solid #ddd';
  box.style.borderRadius = '8px';
  box.style.padding = '8px';
  box.style.boxShadow = '0 4px 12px rgba(0,0,0,0.1)';
  box.style.zIndex = '9999';
  box.style.width = '240px';

  // ✅ search
  let search = document.createElement('input');
  search.placeholder = 'search...';
  search.style.width = '100%';
  search.style.marginBottom = '6px';

  box.appendChild(search);

  let list = document.createElement('div');
  list.style.maxHeight = '200px';
  list.style.overflowY = 'auto';

  function renderList(keyword=''){
    list.innerHTML = '';

    values
      .filter(v => v.toLowerCase().includes(keyword))
      .forEach(v => {

        let row = document.createElement('label');
        row.style.display = 'flex';
        row.style.alignItems = 'center';
        row.style.gap = '4px';
   row.style.padding = '4px 0';
        let cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = selected.includes(v);

        cb.onchange = ()=>{
          if(cb.checked){
            if(!selected.includes(v)) selected.push(v);
          }else{
            selected = selected.filter(x=>x!==v);
          }

          onChange(selected);
        };

        let text = document.createElement('span');
        text.textContent = v;
text.style.fontSize = '14px';
text.style.whiteSpace = 'nowrap';
text.style.overflow = 'hidden';
text.style.textOverflow = 'ellipsis';

        row.append(cb, text);
        list.appendChild(row);
      });
  }

  search.oninput = ()=>{
    renderList(search.value.toLowerCase());
  };

  renderList();

  box.appendChild(list);

  // ✅ 點外面關閉
  setTimeout(()=>{
    document.addEventListener('click', function close(e){
      if(!box.contains(e.target)){
        box.remove();
        document.removeEventListener('click', close);
      }
    });
  });

  return box;
}

  const panel = document.getElementById('todoPanel');
 const list = document.getElementById('todoList');

// ✅ Todo DB
let todoDB = JSON.parse(localStorage.getItem('TODO_DB') || '[]');

    panel.classList.toggle('open');

  // ✅  iPhone Todo

function createTodoItem(value='', checked=false){

  let row = document.createElement('div');
  row.style.display = 'flex';
  row.style.alignItems = 'center';
  row.style.marginBottom = '6px';
  row.style.gap = '6px';

  let check = document.createElement('input');
  check.type = 'checkbox';
  check.checked = checked;

  let input = document.createElement('input');
  input.type = 'text';
  input.value = value;
  input.style.flex = '1';
  input.style.border = 'none';
  input.style.outline = 'none';
  input.style.background = 'transparent';
  row._input = input;
  row._check = check;
  let del = document.createElement('div');
  del.textContent = '✕';
  del.style.cursor = 'pointer';

  // ✅ 存資料
 
function saveDB(){

  let data = [];

  Array.from(list.children).forEach(r => {

    let txt = r._input.value;
    let chk = r._check.checked;

    if(txt.trim() !== ''){
      data.push({text: txt, done: chk});
    }

  });

  localStorage.setItem('TODO_DB', JSON.stringify(data));
}

  // ✅ 勾選
  check.onchange = () => {
    if(check.checked){
      input.style.textDecoration = 'line-through';
      input.style.color = '#999';
    }else{
      input.style.textDecoration = 'none';
      input.style.color = '#000';
    }
    saveDB();
  };

  // ✅ Enter 新增
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      let newRow = createTodoItem('');
      list.appendChild(newRow);
      newRow.querySelector('input').focus();
      saveDB();
    }
  });

  // ✅ 輸入同步
  input.oninput = saveDB;

  // ✅ 刪除
  del.onclick = () => {
    row.remove();
    saveDB();
  };

  // ✅ 初始狀態
  if(checked){
    input.style.textDecoration = 'line-through';
    input.style.color = '#999';
  }

  row.append(check, input, del);
  return row;
}

if(todoDB.length === 0){
  list.appendChild(createTodoItem());
}else{
  todoDB.forEach(item => {
    list.appendChild(createTodoItem(item.text, item.done));
  });
}

});
